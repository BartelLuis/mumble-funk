# Separate instance; never use the standard Mumble database here.
database=/var/lib/mumble-funk/server.sqlite
host=0.0.0.0
port=64739
users=20
bandwidth=72000
serverpassword=@PASSWORD@
welcometext="Mumble-Funk Entwicklungsserver"
registerName=Mumble-Funk
ice=
bonjour=false
# With -fg, systemd captures output in the dedicated server.log.
logfile=
voicediagnostics=false
voicediagnosticsfile=/var/log/mumble-funk/voice
voicediagnosticstimeout=500
voicediagnosticsmaxsize=10485760
# Fresh installations enable radio mode; existing server.ini files are never rewritten.
simplex=true
#simplextimeout=500
#simplexretrytimeout=1000
#simplexdiagnostics=false
#simplexlogfile=/var/log/mumble-funk/simplex
#simplexlogmaxsize=10485760
#simplexloggrants=true
#simplexlogdenials=true
#simplexlogreleases=true
# Fresh installations enable experimental effects; missing keys in older INIs keep core defaults.
audiofeedback=true
busytone=true
busytonefile=/usr/local/share/mumble-funk/audio/busy-tone.wav
busytonevolume=50
feedbackboostdb=8
squelch=true
squelchopen=true
squelchclose=true
squelchclosetimeoutfallback=true
squelchopenfile=/usr/local/share/mumble-funk/audio/squelch-open.wav
squelchclosefile=/usr/local/share/mumble-funk/audio/squelch-close.wav
squelchopenvolume=50
squelchclosevolume=50
radionoise=true
radionoisefile=/usr/local/share/mumble-funk/audio/radio-noise.wav
radionoisevolume=20
