# Separate instance; never use the standard Mumble database here.
database=/var/lib/mumble-funk-audio/server.sqlite
host=0.0.0.0
port=64740
users=20
bandwidth=72000
serverpassword=@PASSWORD@
welcometext="Mumble-Funk v0.3 AUDIO-PREVIEW (experimentell)"
registerName=Mumble-Funk Audio-Preview
ice=
bonjour=false
# With -fg, systemd captures output in the dedicated server.log.
logfile=
voicediagnostics=false
voicediagnosticsfile=/var/log/mumble-funk-audio/voice
voicediagnosticstimeout=500
voicediagnosticsmaxsize=10485760
# Optional radio mode; existing installations keep their server.ini unchanged.
#simplex=false
#simplextimeout=500
#simplexretrytimeout=1000
#simplexdiagnostics=false
#simplexlogfile=/var/log/mumble-funk-audio/simplex
#simplexlogmaxsize=10485760
#simplexloggrants=true
#simplexlogdenials=true
#simplexlogreleases=true

# Experimental, private feedback. Existing config files are never overwritten.
audiofeedback=true
busytone=true
busytonevolume=50
# Optional own PCM WAV; loaded only at startup. Empty means synthetic default.
busytonefile=
