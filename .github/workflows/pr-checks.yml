name: Installer checks
on:
  push:
    branches: [dev, stable, 'integration/**', 'feature/**']
  pull_request:
    branches: [dev, stable]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck iproute2
      - name: Shell and patch checks
        run: |
          shellcheck scripts/funk/audio-preview/*.sh scripts/funk/*.sh scripts/docker/*.sh tests/funk-install/ubuntu_container_check.sh
          git diff --check HEAD^ HEAD
      - name: Source guards and setup orchestration
        run: |
          python3 tests/funk-install/test_source.py
          python3 tests/funk-install/test_setup.py
          python3 tests/funk-install/test_audio_security.py
          python3 -m unittest discover -s scripts/docker/tests -p 'test_*.py'
