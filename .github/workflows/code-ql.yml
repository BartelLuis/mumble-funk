name: Server code scanning
on:
  push:
    branches: [dev, stable, 'integration/**']
  pull_request:
    branches: [dev, stable]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v3
        with:
          languages: python, cpp
      - name: Install server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config qtbase5-dev qtbase5-dev-tools libqt5sql5-sqlite libboost-dev libssl-dev libopus-dev libprotobuf-dev protobuf-compiler libprotoc-dev libcap-dev libavahi-compat-libdnssd-dev libzeroc-ice-dev
      - name: Build server only
        run: |
          cmake -S . -B build/scan -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_NUMBER=939 -Dclient=OFF -Dserver=ON -Dtests=OFF -Dplugins=OFF -Doverlay=OFF -Dlto=OFF -DCMAKE_UNITY_BUILD=OFF
          cmake --build build/scan --parallel 2
      - uses: github/codeql-action/analyze@v3
